name: Daily Stock Report

on:
  schedule:
    - cron: "0 13 * * 1-5"

  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python generate_report.py
